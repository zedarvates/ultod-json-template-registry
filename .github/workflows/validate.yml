name: Validate registry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run registry automation tests
        run: python -m unittest discover -s tests -v
      - name: Run registry validation script
        run: python scripts/validate_registry.py
